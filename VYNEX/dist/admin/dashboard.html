<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | VYNEX Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-responsive.css">
  <script src="../bg-scene.js" data-mode="admin" defer></script>
</head>
<body data-page="dashboard" >
  <div class="admin-app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-content">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1>Dashboard</h1>
        
      </header>
      <main class="admin-main">

        <div class="alert" id="dashAlert" hidden></div>
        <div class="stats">
          <div class="stat-card"><span>Total projects</span><strong id="sProjects">–</strong></div>
          <div class="stat-card"><span>Published</span><strong id="sPublished">–</strong></div>
          <div class="stat-card"><span>Drafts</span><strong id="sDrafts">–</strong></div>
          <div class="stat-card"><span>Total services</span><strong id="sServices">–</strong></div>
          <div class="stat-card"><span>Total inquiries</span><strong id="sInquiries">–</strong></div>
          <div class="stat-card"><span>Pending quotes</span><strong id="sQuotes">–</strong></div>
          <div class="stat-card"><span>Managed websites</span><strong id="sManaged">–</strong></div>
          <div class="stat-card"><span>Contracts ending ≤30 days</span><strong id="sExpiring">–</strong></div>
        </div>
        <div class="panel"><h2>Recent activity</h2><ul class="activity" id="activity"><li><span style="color:var(--muted)">Loading…</span></li></ul></div>
        <div class="panel"><h2>Quick actions</h2><div class="btn-row"><a class="btn btn-primary" href="add-project.html">+ Add project</a><a class="btn btn-ghost" href="managed-websites.html">Managed websites</a><a class="btn btn-ghost" href="services.html">Manage services</a><a class="btn btn-ghost" href="inquiries.html">View messages</a><a class="btn btn-ghost" href="company-information.html">Company info</a></div></div>
      </main>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="../icons.js"></script>
  <script src="admin.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
