<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | VYNEX Web Solutions</title>
  <meta name="description" content="Get in touch with VYNEX Web Solutions to discuss your website, app or software project.">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact Us | VYNEX Web Solutions">
  <meta property="og:description" content="Get in touch with VYNEX Web Solutions to discuss your website, app or software project.">
  <meta property="og:image" content="images/hero-code.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact-icons.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="image-motion.css">
  <link rel="stylesheet" href="image-live.css">
  <link rel="stylesheet" href="image-devices.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="pro.css">
  <link rel="stylesheet" href="assistant.css">
  <script src="bg-scene.js" data-scene="network" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="hero-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
      <div class="container" style="position:relative;z-index:2">
        <span class="eyebrow">Contact</span>
        <h1>Let's <span class='gradient-text'>talk</span></h1>
        <p>Have a question or an idea? Send us a message and we'll respond as soon as we can.</p>
      </div>
    </section>

    <section class="section" style="padding-top:20px">
      <div class="container contact-grid">
        <div data-reveal>
          <h2 style="font-size:1.8rem">Contact details</h2>
          <p>Reach us directly or send a message using the form.</p>
          <div class="contact-icons contact-icons-xl" data-contact-icons aria-label="Contact us"></div>
          <p class="contact-loc" data-company="location" hidden></p>
        </div>
        <form class="form" id="contactForm" data-form="contact" novalidate data-reveal>
          <div class="form-row">
            <div class="field"><label for="cName">Full name</label><input id="cName" name="name" required maxlength="120" autocomplete="name"></div>
            <div class="field"><label for="cEmail">Email</label><input id="cEmail" name="email" type="email" required maxlength="160" autocomplete="email"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="cPhone">Phone (optional)</label><input id="cPhone" name="phone" maxlength="40" autocomplete="tel"></div>
            <div class="field"><label for="cSubject">Subject</label><input id="cSubject" name="subject" maxlength="160"></div>
          </div>
          <div class="field"><label for="cMessage">Message</label><textarea id="cMessage" name="message" required maxlength="3000"></textarea></div>
          <div class="hp-field" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="btn btn-primary" type="submit">Send Message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="icons.js"></script>
  <script src="navigation.js"></script>
  <script src="script.js"></script>
  <script src="image-loader.js"></script>
  <script src="forms.js"></script>
  <script src="animations.js"></script>
  <script src="image-motion.js" defer></script>
  <script src="image-live.js" defer></script>
  <script src="image-devices.js" defer></script>
  <script src="pro.js"></script>
  <script src="assistant.js" defer></script>
</body>
</html>
