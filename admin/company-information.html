<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Company Information | VYNEX Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="../contact-icons.css">
  <link rel="stylesheet" href="admin-responsive.css">
  <script src="../bg-scene.js" data-mode="admin" defer></script>
</head>
<body data-page="company" >
  <div class="admin-app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-content">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1>Company Information</h1>
        
      </header>
      <main class="admin-main">

        <form id="companyForm" class="panel">
          <div class="form-grid">
            <div class="field full img-field"><label>Company logo (optional override)</label><div class="preview" id="logoPrev">No logo</div><input type="file" id="logoFile" accept="image/*"><small id="logoSt">Leave empty to use public/images/logo.png.</small></div>
          <div class="field"><label for="c_name">Company name</label><input id="c_name" type="text" placeholder=""></div>
          <div class="field"><label for="c_tagline">Tagline</label><input id="c_tagline" type="text" placeholder=""></div>
          <div class="field full"><label for="c_description">Company description (shown on the homepage and in the footer)</label><textarea id="c_description" style="min-height:100px" placeholder=""></textarea></div>
          <div class="field full"><label for="c_about">About information (About Us page)</label><textarea id="c_about" style="min-height:100px" placeholder=""></textarea></div>
          <div class="field full"><label for="c_mission">Mission</label><textarea id="c_mission" style="min-height:100px" placeholder=""></textarea></div>
          <div class="field full"><label for="c_vision">Vision</label><textarea id="c_vision" style="min-height:100px" placeholder=""></textarea></div>
          <div class="field full contact-box">
            <h2 class="sub-h">Contact &amp; social links</h2>
            <p class="hint">These are the icons visitors see on the website (home page, contact page and footer). Each icon opens whatever you enter here. Leave a box empty and that icon is hidden.</p>
            <div class="contact-icons contact-prev" id="contactPrev" aria-label="Preview of the icons on the website"></div>
          </div>
          <div class="field"><label for="c_phone"><span class="lbl-ico" data-ico="call"></span> Call — phone number</label><input id="c_phone" type="text" inputmode="tel" placeholder="+254 7XX XXX XXX"><small class="resolved" data-for="phone"></small></div>
          <div class="field"><label for="c_whatsapp"><span class="lbl-ico" data-ico="whatsapp"></span> WhatsApp — number or link</label><input id="c_whatsapp" type="text" placeholder="+254 7XX XXX XXX  or  https://wa.me/254…"><small class="resolved" data-for="whatsapp"></small></div>
          <div class="field"><label for="c_email"><span class="lbl-ico" data-ico="email"></span> Email address</label><input id="c_email" type="text" inputmode="email" placeholder="name@yourdomain.com"><small class="resolved" data-for="email"></small></div>
          <div class="field"><label for="c_social_instagram"><span class="lbl-ico" data-ico="instagram"></span> Instagram — profile link</label><input id="c_social_instagram" type="text" placeholder="https://instagram.com/yourpage  (or @yourpage)"><small class="resolved" data-for="social_instagram"></small></div>
          <div class="field"><label for="c_social_tiktok"><span class="lbl-ico" data-ico="tiktok"></span> TikTok — profile link</label><input id="c_social_tiktok" type="text" placeholder="https://www.tiktok.com/@yourpage  (or @yourpage)"><small class="resolved" data-for="social_tiktok"></small></div>
          <div class="field"><label for="c_social_twitter"><span class="lbl-ico" data-ico="x"></span> X — profile link</label><input id="c_social_twitter" type="text" placeholder="https://x.com/yourpage  (or @yourpage)"><small class="resolved" data-for="social_twitter"></small></div>
          <div class="field full"><label for="c_location">Physical location (shown as text, optional)</label><input id="c_location" type="text" placeholder=""></div>
          </div>
          <p class="status" id="cStatus" role="status"></p>
          <button class="btn btn-primary" type="submit">Save company information</button>
        </form>
      </main>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="../icons.js"></script>
  <script src="admin.js"></script>
  <script src="auth.js"></script>
  <script src="settings.js"></script>
</body>
</html>
