# VYNEX/render.yaml — testing on Render (free static site). Same build output as Netlify.
services:
  - type: web
    name: vynex
    runtime: static
    buildCommand: node scripts/build.js
    staticPublishPath: dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow
